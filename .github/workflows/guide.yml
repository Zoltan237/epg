name: Generate guide
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run grab --- --channels=sites/canalplus.com/canalplus.com_fr.channels.xml --days=2 --output=guide.xml
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f guide.xml
          git commit -m "update guide" || exit 0
          git push
